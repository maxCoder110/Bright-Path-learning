<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrightPath Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 50px;
            text-shadow: 0 0 20px #00ffff;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        .game-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-card {
            width: 300px;
            height: 400px;
            background: #111;
            border: 2px solid #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }
        .game-card:hover {
            transform: translateY(-10px);
        }
        .game-card.neon-cycle:hover {
            box-shadow: 0 0 30px #00ffcc;
            border-color: #00ffcc;
        }
        .game-card.neon-warfare:hover {
            box-shadow: 0 0 30px #ff0055;
            border-color: #ff0055;
        }
        .game-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            z-index: 2;
        }
        .play-btn {
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 2;
        }
        .neon-cycle .play-btn { background: #00ffcc; color: #000; }
        .neon-warfare .play-btn { background: #ff0055; color: white; }
        
        .back-link {
            margin-top: 50px;
            color: #888;
            text-decoration: none;
        }
        .back-link:hover { color: white; }
    </style>
</head>
<body>

    <h1>BrightPath Arcade</h1>

    <div class="game-container">
        <a href="game-cycle.html" class="game-card neon-cycle">
            <div class="game-title" style="color: #00ffcc;">NEON CYCLE<br>GRID WARS</div>
            <div class="play-btn">Play Now</div>
        </a>

        <a href="game-warfare.html" class="game-card neon-warfare">
            <div class="game-title" style="color: #ff0055;">NEON WARFARE<br>SAGA</div>
            <div class="play-btn">Play Now</div>
        </a>
    </div>

    <a href="index.html" class="back-link">← Back to Main Website</a>

</body>
</html>
